<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood Meme Picker</title>
<link rel="stylesheet" href="mood picker meme.css">
</head>
<body>
<main>
  <h1>Mood Meme Picker</h1>
  <p class="sub">How are you feeling right now?</p>
  <div class="moods" id="moods"></div>
  <div class="card">
    <div id="emoji">🤔</div>
    <p id="caption" class="hint">Pick a mood above and get your meme.</p>
    <button id="again" hidden>Another one 🎲</button>
  </div>
</main>

<script src="mood picker meme.js"></script>
</body>
</html>
